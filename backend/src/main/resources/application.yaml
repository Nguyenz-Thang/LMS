server:
  port: ${PORT:8080}
  servlet:
    context-path: /lms

spring:
  application:
    name: LMS

  datasource:
    url: jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}

jwt:
  signerKey: ${JWT_SIGNER_KEY}
  valid-duration: 60
  refreshable-duration: 72

openai:
  api-key: ${OPENAI_API_KEY:}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  model: ${OPENAI_MODEL:gpt-4o-mini}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

transcript-api:
  api-key: ${TRANSCRIPT_API_KEY:}
  base-url: ${TRANSCRIPT_API_BASE_URL:https://transcriptapi.com}

lms:
  frontend-base-url: ${LMS_FRONTEND_BASE_URL}
  mail:
    enabled: ${LMS_MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@lms.local}
    weekly-progress-cron: ${LMS_WEEKLY_PROGRESS_CRON:0 0 7 * * MON}
  payment:
    pending-expire-minutes: ${LMS_PAYMENT_PENDING_EXPIRE_MINUTES:30}
    sepay:
      bank-code: ${SEPAY_BANK_CODE:TPB}
      bank-name: ${SEPAY_BANK_NAME:TPBank}
      account-number: ${SEPAY_ACCOUNT_NUMBER:88826062004}
      account-name: ${SEPAY_ACCOUNT_NAME:NGUYEN TAT THANG}
      payment-prefix: ${SEPAY_PAYMENT_PREFIX:LMS}
      webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:}
      webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
