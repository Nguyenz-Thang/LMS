server:
  port: 8080
  servlet:
    context-path: /lms
spring:
  application:
    name: LMS
  datasource:
    url: "jdbc:mysql://localhost:3306/lms_db"
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
jwt:
  signerKey: "9POlrNobyAby/kPvcYdhlTYF5g2lWgHzHxjVmbHqOxo="
  valid-duration: 60 # in hours
  refreshable-duration: 72 # in hours
gemini:
  api-key: ${GEMINI_API_KEY:}
  base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
lms:
  frontend-base-url: ${LMS_FRONTEND_BASE_URL:http://localhost:5173}
  mail:
    enabled: ${LMS_MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@lms.local}
    weekly-progress-cron: ${LMS_WEEKLY_PROGRESS_CRON:0 0 7 * * MON}
  payment:
    pending-expire-minutes: ${LMS_PAYMENT_PENDING_EXPIRE_MINUTES:30}
    sepay:
      bank-code: ${SEPAY_BANK_CODE:TPB}
      bank-name: ${SEPAY_BANK_NAME:TPBank}
      account-number: ${SEPAY_ACCOUNT_NUMBER:88826062004}
      account-name: ${SEPAY_ACCOUNT_NAME:NGUYEN TAT THANG}
      payment-prefix: ${SEPAY_PAYMENT_PREFIX:LMS}
      webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:}
      webhook-secret: ${SEPAY_WEBHOOK_SECRET:}
